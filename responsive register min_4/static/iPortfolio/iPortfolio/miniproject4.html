<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REGISTRATION FORM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container m-4">
        <div class="row">
            <div class="col-md-3"></div>
            <div class="col-md-6">
                <div class="row justify-content-center">
                    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                        <h4 class="text-center text-success">REGISTER HERE FOR AN EVENT</h4>
                        <div class="card bg-light p-3 shadow-sm">
                            <div class="card-body">
                                <form action="">
                                    <div class="mb-3">
                                        <label for="firstName" class="form-lable">First Name</label>
                                        <input type="text" class="form-control" id="firstName"
                                            placeholder="Enter your first name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="lastName" class="form-lable">Last Name</label>
                                        <input type="text" class="form-control" id="lastName"
                                            placeholder="Enter your last name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="email" class="form-lable">Email ID</label>
                                        <input type="text" class="form-control" id="email"
                                            placeholder="Enter your mail id" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-lable">Password</label>
                                        <input type="text" class="form-control" id="password"
                                            placeholder="Enter a srtong password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="confrimpassword" class="form-lable">Confirm Password</label>
                                        <input type="text" class="form-control" id="confirmpassword"
                                            placeholder="re-enter your password" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="grnder" class="form-lable">Select your gender</label>
                                        <select class="form-select" id="gender">
                                            <option value="" disabled select>select your gender</option>
                                            <option value="Female">FEMALE</option>
                                            <option value="Male">MALE</option>
                                            <option value="Other">OTHER</option>
                                        </select>
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="terms" required>
                                        <label class="form-check-lable" for="terms">I agree to terms and
                                            conditions</label>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Register</button>
                                </form>

                            </div>
                        </div>
                    </div>
                    <div class="col-md-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
